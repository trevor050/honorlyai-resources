name: Correction or clarification
description: Report an inaccurate statement, broken link, inaccessible section, or unclear instruction.
title: "Correction: "
labels: []
body:
  - type: input
    id: file
    attributes:
      label: File or URL
      placeholder: templates/example.md or https://...
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is wrong or unclear?
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed correction
  - type: textarea
    id: sources
    attributes:
      label: Supporting sources
      description: Prefer current primary sources for legal, regulatory, standards, and factual corrections.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I have not included student records, personal information, confidential material, or vulnerability details.
          required: true
